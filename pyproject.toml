[project]
name = "trakt-watchlist-monitor"
version = "0.0.79"
description = "Monitor a Trakt watchlist for Amazon Prime Video price drops"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "python-dateutil>=2.9.0.post0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pylint>=4.0.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-requests",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["trakt_watchlist_monitor", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "fixme",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
